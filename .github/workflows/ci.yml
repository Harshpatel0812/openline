name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openline
          POSTGRES_PASSWORD: openline
          POSTGRES_DB: openline_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U openline"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://openline:openline@localhost:5432/openline_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Tenant isolation tests on real Postgres 16
        run: pnpm --filter @openline/db test
        env:
          TEST_DATABASE_URL: postgresql://openline:openline@localhost:5432/openline_test

      - name: Audit dependencies (fail on high or critical)
        run: pnpm audit --audit-level=high --prod

  e2e:
    name: End-to-end smoke (Playwright)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The journeys start the built API (apps/api/dist) and web app, so build everything.
      - name: Build
        run: pnpm build

      - name: Install browser
        run: pnpm --filter @openline/e2e exec playwright install --with-deps chromium

      - name: Run e2e
        run: pnpm e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7

  windows-dev:
    # Most of us develop on Windows: prove that the README steps work there.
    name: Local dev on Windows (pnpm dev)
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: pnpm dev serves the API and the web app, and sign-up works
        run: |
          # Stream output live: in CI turbo otherwise holds a task's log until it ends, and dev never ends.
          pnpm dev --log-order=stream > dev.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -fs http://localhost:4000/health > /dev/null && curl -fs http://localhost:3000/signup > /dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:4000/health
          curl -fsS -o /dev/null http://localhost:3000/signup
          curl -fsS -o /dev/null -w "sign-up: %{http_code}\n" \
            -H "content-type: application/json" -H "x-openline-csrf: 1" \
            -d '{"name":"CI","email":"ci@example.com","password":"correct horse battery staple","workspaceName":"CI"}' \
            http://localhost:3000/api/v1/auth/signup
          sleep 2
          grep -q "verify-email?token=" dev.log

      - name: Show the dev log
        if: always()
        run: cat dev.log || true

  sast:
    name: Static security analysis (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      - name: Semgrep scan
        run: semgrep scan --config p/typescript --config p/nodejs --config p/secrets --error --metrics=off

  secrets:
    name: Secret scan (TruffleHog)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # TODO(OL-E1): pin to a release commit SHA once the repo is live (Dependabot keeps it current).
      # On pull requests the action diffs the PR; on pushes to main it scans what the push added.
      - uses: trufflesecurity/trufflehog@main
        with:
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          head: ${{ github.event_name == 'push' && github.event.after || '' }}
          extra_args: --results=verified,unknown
