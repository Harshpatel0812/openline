# Local development services. Start with: pnpm services:up
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openline
      POSTGRES_PASSWORD: openline
      POSTGRES_DB: openline
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openline"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Fake inbox: every email sent locally lands here (UI at http://localhost:8025).
  # Local and staging NEVER send to real prospects.
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

volumes:
  pgdata:
